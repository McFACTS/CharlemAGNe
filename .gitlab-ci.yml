# CI on CPUs: GCC on CentOS oughta build about anything

image: docker.io/almalinux:10

variables:
  GIT_STRATEGY: clone
  GIT_SUBMODULE_STRATEGY: recursive
  CHARLEMAGNE_OPACITY_NAME: "pagn_combined"
  CHARLEMAGNE_OPACITY_PATH: "${CI_PROJECT_DIR}/python/charlemagne/data/pagn_combined.sp5"
  CHARLEMAGNE_OPACITY_ID: "1001"


### DEFAULT TEST BEHAVIOR ###
default:
  # By default: install hdf5
  before_script:
    - dnf -y groupinstall "Development Tools"
    - dnf -y install epel-release
    - dnf -y install cmake hdf5
  # Always keep logs and plots.  Results should be printed to console!
  # artifacts:
  #   when: always
  #   paths:
  #     - tests/*/*.png
  #     - tests/*/*.txt

# Tests can be executed in parallel
stages:
  - build
  - unit
  - tests

# Build, obviously overrides script/artifacts
build:
  stage: build
  before_script:
    - dnf -y groupinstall "Development Tools"
    - dnf -y install epel-release
    - dnf -y install cmake hdf5-devel hdf5-static
    - dnf -y install python3-devel python3-numpy
    - dnf -y install python3-build
    - dnf -y install python3-pytest
  script:
    - make tests
  artifacts:
    paths:
      - build/

# Unit tests; does the C++ compile and behave?
unit:
  stage: unit
  script:
    make tests

# Does the abi wheel compile and behave?
python:
  stage: tests
  script:
    make pytest

