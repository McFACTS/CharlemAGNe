[build-system]
requires = [
            "meson-python>=0.13.0",
            "meson>=1.3.0",
            "wheel",
            "numpy>=2.0",
           ]
build-backend = 'mesonpy'

[tool.meson-python]
limited-api = true

[tool.meson-python.args]
setup = ["--warnlevel=2"]

[tool.cibuildwheel]
build = "cp39-* cp314t-*"
skip = "*-musllinux_*"

[[tool.cibuildwheel.overrides]]
select = "*t-*"
config-settings = { setup-args = "-Dpython.allow_limited_api=false" }

[tool.cibuildwheel.linux]
container-engine = "podman"
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
before-all = '''
set -e
dnf install -y hdf5-devel hdf5-static
test -f /usr/include/hdf5.h
printf 'prefix=/usr\nlibdir=/usr/lib64\nincludedir=/usr/include\n\nName: hdf5\nDescription: HDF5\nVersion: 1.10.4\nLibs: -L${libdir} -lhdf5\nLibs.static: -L${libdir} -lhdf5 -lz -ldl -lm\nCflags: -I${includedir}\n' > /usr/local/lib/pkgconfig/hdf5.pc
printf 'prefix=/usr\nlibdir=/usr/lib64\nincludedir=/usr/include\n\nName: hdf5_hl\nDescription: HDF5 HL\nVersion: 1.10.4\nRequires: hdf5\nLibs: -L${libdir} -lhdf5_hl\nLibs.static: -L${libdir} -lhdf5_hl -lhdf5 -lz -ldl -lm\nCflags: -I${includedir}\n' > /usr/local/lib/pkgconfig/hdf5_hl.pc
pkg-config --modversion hdf5 hdf5_hl
'''
test-requires = ["pytest"]
test-command = "pytest {project}/tests -q"


[tool.cibuildwheel.macos]
#archs = ["x86_64", "arm64"]
test-requires = ["pytest"]
test-command = "pytest {project}/tests -q"

[tool.cibuildwheel.macos.environment]
#MACOSX_DEPLOYMENT_TARGET = "12.1"
#PKG_CONFIG_PATH = "/Users/xevra/miniconda3/envs/py39/lib/pkgconfig"
#LIBRARY_PATH = "/Users/xevra/miniconda3/envs/py39/lib"
#CPATH = "/Users/xevra/miniconda3/envs/py39/include"
#LDFLAGS = ""
#CPPFLAGS = ""
#CXXFLAGS = ""

[project]
name = "charlemagne"
dynamic = ["version"]
description = "CharlemAGNe"
authors = [
    {name = "V. Delfavero", email="vdfavero@cita.utoronto.ca"},
]
maintainers = [
    {name = "V. Delfavero", email="vdfavero@cita.utoronto.ca"},
]
license = "GPL-3.0-only"
license-files = ["LICENSE-GPL-3"]
readme = "README.md"
requires-python = ">=3.9,<3.16"
keywords = ["Active Galactic Nuclei", "AGN", "SG03", "TQM05"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "numpy>=1.19.0,<2.6.0",
    #"matplotlib>=3.8",
    #"scipy>=1.11.0",
    #"fast_histogram>=0.12",
    #"astropy>=6.0",
]

[project.urls]
Homepage = "https://gitlab.com/xevra/charlemagne"
"Bug tracker" = "https://gitlab.com/xevra/charlemagne/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
