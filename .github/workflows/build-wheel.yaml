name: CI

# Run on any push or PR to main, and whenever there is a version tag
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# Read the repository. No write
permissions:
  contents: read

# Don't run multiple at a time from the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Environment variables
env:
  CIBW_CONTAINER_ENGINE: docker
  CHARLEMAGNE_OPACITY_NAME: pagn_combined
  CHARLEMAGNE_OPACITY_PATH: ${{ github.workspace }}/python/charlemagne/data/pagn_combined.sp5
  CHARLEMAGNE_OPACITY_ID: "1001"

jobs:
  build:
    runs-on: ubuntu-latest
    container: docker.io/almalinux:10
    steps:
      - name: Reinstall git
        run: dnf -y install git
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - name: Install build dependencies
        run: |
          dnf -y groupinstall "Development Tools"
          dnf -y install epel-release
          dnf config-manager --set-enabled crb || true
          dnf -y install cmake hdf5 hdf5-devel hdf5-static
          dnf -y install python3-devel python3-numpy python3-build python3-pytest
      - run: make configure
      - uses: actions/upload-artifact@v4
        with: { name: build-dir, path: build/ }

  unit:
    needs: build
    runs-on: ubuntu-latest
    container: docker.io/almalinux:10
    steps:
      - name: Reinstall git
        run: dnf -y install git
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - name: Trust the workspace for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: |
          dnf -y groupinstall "Development Tools"
          dnf -y install epel-release
          dnf config-manager --set-enabled crb || true
          dnf -y install cmake hdf5 hdf5-devel hdf5-static
          dnf -y install python3-devel python3-numpy
      - run: make tests

  pytest:
    needs: build
    runs-on: ubuntu-latest
    container: docker.io/almalinux:10
    steps:
      - name: Reinstall git
        run: dnf -y install git
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - name: Trust the workspace for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: |
          dnf -y groupinstall "Development Tools"
          dnf -y install epel-release
          dnf config-manager --set-enabled crb || true
          dnf -y install cmake hdf5 hdf5-devel hdf5-static
          dnf -y install python3-devel python3-pip python3-numpy python3-build python3-pytest
      - run: make pytest
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist/ }

  wheels-linux:
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install cibuildwheel
      - run: make local-wheels
      - uses: actions/upload-artifact@v4
        with: { name: "wheels-linux-${{ matrix.os }}", path: local-wheels/*.whl }

  wheels-macos:
    strategy:
      matrix:
        os: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    env:
      CIBW_BUILD_VERBOSITY: 2
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: brew install hdf5 libaec
      - name: Point builds at brew hdf5
        run: |
          echo "PKG_CONFIG_PATH=$(brew --prefix hdf5)/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=$(brew --prefix hdf5)/lib" >> "$GITHUB_ENV"
          echo "CPATH=$(brew --prefix hdf5)/include" >> "$GITHUB_ENV"
      - run: pip install cibuildwheel
      - name: Diagnose hdf5 visibility
        run: |
          brew --prefix hdf5
          ls "$(brew --prefix hdf5)/lib/" | grep -i hdf5 || true
          pkg-config --modversion hdf5 hdf5_hl
          pkg-config --static --libs hdf5_hl || true
          echo "PKG_CONFIG_PATH=$PKG_CONFIG_PATH LIBRARY_PATH=$LIBRARY_PATH"
      - run: make local-wheels
      - uses: actions/upload-artifact@v4
        with: { name: "wheels-macos-${{ matrix.os }}", path: local-wheels/*.whl }
