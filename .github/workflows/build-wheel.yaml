name: CI

# Run on any push or PR to main, and whenever there is a version tag
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# Read the repository. No write
permissions:
  contents: read

# Don't run multiple at a time from the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Environment variables
env:
  CHARLEMAGNE_OPACITY_NAME: pagn_combined
  CHARLEMAGNE_OPACITY_PATH: ${{ github.workspace }}/python/charlemagne/data/pagn_combined.sp5
  CHARLEMAGNE_OPACITY_ID: "1001"

jobs:
  build:
    runs-on: ubuntu-latest
    container: docker.io/almalinux:10
    steps:
      - name: Reinstall git
        run: dnf -y install git
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - name: Install build dependencies
        run: |
          dnf -y groupinstall "Development Tools"
          dnf -y install epel-release
          dnf config-manager --set-enabled crb || true
          dnf -y install cmake hdf5-devel hdf5-static
          dnf -y install python3-devel python3-numpy python3-build python3-pytest
      - run: make configure
      - uses: actions/upload-artifact@v4
        with: { name: build-dir, path: build/ }

  unit:
    needs: build
    runs-on: ubuntu-latest
    container: docker.io/almalinux:10
    steps:
      - name: Reinstall git
        run: dnf -y install git
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - name: Trust the workspace for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: |
          dnf -y groupinstall "Development Tools"
          dnf -y install epel-release
          dnf config-manager --set-enabled crb || true
          dnf -y install cmake hdf5-devel hdf5-static
      - run: make tests

  pytest:
    needs: build
    runs-on: ubuntu-latest
    container: docker.io/almalinux:10
    steps:
      - name: Reinstall git
        run: dnf -y install git
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - name: Trust the workspace for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: |
          dnf -y groupinstall "Development Tools"
          dnf -y install epel-release
          dnf config-manager --set-enabled crb || true
          dnf -y install cmake python3-devel python3-pip python3-numpy python3-build python3-pytest
      - run: make pytest
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist/ }

  wheels-linux:
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    env:
      CIBW_CONTAINER_ENGINE: docker
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install cibuildwheel
      - run: make local-wheels
      - uses: actions/upload-artifact@v4
        with: { name: "wheels-linux-${{ matrix.os }}", path: local-wheels/*.whl }

  wheels-macos:
    strategy:
      matrix:
        os: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    env:
      CIBW_BUILD_VERBOSITY: 2
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install cibuildwheel
      - run: make local-wheels
      - uses: actions/upload-artifact@v4
        with: { name: "wheels-macos-${{ matrix.os }}", path: local-wheels/*.whl }

  wheels-windows:
    strategy:
      matrix:
        include:
          - os: windows-latest
            triplet: x64-windows-static-md
          # - os: windows-11-arm
          #   triplet: arm64-windows-static-md
    runs-on: ${{ matrix.os }}
    env:
      CIBW_BUILD_VERBOSITY: 2
      VCPKG_ROOT: C:\vcpkg
      VCPKG_DEFAULT_TRIPLET: ${{ matrix.triplet }}
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install cibuildwheel
      - name: Install HDF5 + native pkgconf (vcpkg)
        run: |
          vcpkg install "hdf5[core,hl]:${{ matrix.triplet }}" "pkgconf:x64-windows"
          $prefix = "$env:VCPKG_ROOT\installed\${{ matrix.triplet }}"
          "PKG_CONFIG=$env:VCPKG_ROOT\installed\x64-windows\tools\pkgconf\pkgconf.exe" >> $env:GITHUB_ENV
          "PKG_CONFIG_PATH=$prefix\lib\pkgconfig" >> $env:GITHUB_ENV
          Get-ChildItem "$prefix\lib\pkgconfig"
          & "$env:VCPKG_ROOT\installed\x64-windows\tools\pkgconf\pkgconf.exe" --with-path="$prefix\lib\pkgconfig" --static --cflags --libs hdf5 hdf5_hl
      - run: python -m cibuildwheel --output-dir local-wheels
      - uses: actions/upload-artifact@v4
        with: { name: "wheels-windows-${{ matrix.os }}", path: local-wheels/*.whl }
